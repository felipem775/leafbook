    <script>
      // PWA Service Worker for offline caching — web only.
      // Inside Tauri the app is already local, and a cached index.html points to
      // stale asset hashes after a rebuild, leaving the window blank. So in Tauri
      // we skip registration and clean up any SW/cache left by a previous build.
      window.addEventListener('load', () => {
        if (window.isTauri) {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations()
              .then((regs) => regs.forEach((r) => r.unregister()))
              .catch(() => {});
          }
          if (window.caches) {
            caches.keys().then((keys) => keys.forEach((k) => caches.delete(k))).catch(() => {});
          }
          return;
        }
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('sw.js')
            .then((registration) => {
              console.log('PWA Service Worker registrado con éxito:', registration.scope);
            })
            .catch((error) => {
              console.error('Error al registrar PWA Service Worker:', error);
            });
        }
      });
    </script>
